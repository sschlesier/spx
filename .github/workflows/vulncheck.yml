name: Vulncheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths: [ go.mod, go.sum ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Scan for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
