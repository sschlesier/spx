name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge Go minor and patch updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@08eff52bf64351f401fb50d4972fa95b9f2c2d1b # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.meta.outputs.package-ecosystem == 'go_modules'
        run: |
          if jq -e 'any(.[]; .updateType == "version-update:semver-major")' <<<"$DEPENDENCIES" >/dev/null; then
            echo "Major update; leaving for manual review."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          DEPENDENCIES: ${{ steps.meta.outputs.updated-dependencies-json }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
